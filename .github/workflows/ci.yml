name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Lint action entrypoint
        run: shellcheck --severity=warning action/entrypoint.sh

  test-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"

      - name: Build binary
        run: |
          mkdir -p ~/.local/bin
          go build -o ~/.local/bin/evilmerge ./cmd/evilmerge
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run action (no evil merges expected in this repo)
        id: run-action
        run: bash action/entrypoint.sh
        env:
          INPUT_VERSION: prebuilt
          INPUT_FAIL_ON: warning
          INPUT_SEVERITY: info
          INPUT_BRANCH: ""
          INPUT_SINCE: ""
          INPUT_UPLOAD_SARIF: "false"

      - name: Verify outputs
        env:
          FOUND: ${{ steps.run-action.outputs.found }}
          COUNT: ${{ steps.run-action.outputs.count }}
        run: |
          echo "found=$FOUND"
          echo "count=$COUNT"
          [[ "$FOUND" != "" ]] || { echo "ERROR: 'found' output is empty"; exit 1; }
          [[ "$COUNT" != "" ]] || { echo "ERROR: 'count' output is empty"; exit 1; }

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race ./...

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run ./...

  release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "stable"

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
