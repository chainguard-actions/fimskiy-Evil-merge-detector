name: Test evil merges detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake evilmerge binary (with findings)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/evilmerge" << 'EOF'
          #!/usr/bin/env bash
          # Fake evilmerge: returns 2 evil merge reports
          # Check if --fail-on is set; if so, exit 1 to simulate failure
          for arg in "$@"; do
            case "$arg" in
              --fail-on=*) FAIL_ON="${arg#--fail-on=}" ;;
              --format=json) FORMAT="json" ;;
            esac
          done
          if [ "${FORMAT:-}" = "json" ]; then
            cat << 'JSONEOF'
          {"reports":[{"commit_hash":"abc1234567890","message":"Merge branch feature into main\nsome detail","evil_changes":[{"severity":1,"file_path":"src/main.go","detail":"Line added in merge commit not present in either parent"}]},{"commit_hash":"def9876543210","message":"Merge PR #42\nmore detail","evil_changes":[{"severity":2,"file_path":"src/auth.go","detail":"Critical change smuggled in merge"}]}]}
          JSONEOF
          fi
          exit 1
          EOF
          chmod +x "$HOME/.local/bin/evilmerge"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          version: prebuilt
          fail-on: critical
          severity: info
        continue-on-error: true

      - name: Assert evil-merges-found is true
        env:
          ACTUAL: ${{ steps.action.outputs.evil-merges-found }}
        run: |
          echo "actual evil-merges-found: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert evil-merge-count is 2
        env:
          ACTUAL: ${{ steps.action.outputs.evil-merge-count }}
        run: |
          echo "actual evil-merge-count: $ACTUAL"
          if [ "$ACTUAL" != "2" ]; then
            echo "FAIL: expected '2' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
