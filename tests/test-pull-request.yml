name: Test pull request event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: act-harness
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          fail-on: critical
          severity: info
          version: latest

      - name: Assert evil-merges-found output is set
        env:
          FOUND: ${{ steps.action.outputs.evil-merges-found }}
        run: |
          echo "evil-merges-found: $FOUND"
          if [ "$FOUND" != "true" ] && [ "$FOUND" != "false" ]; then
            echo "FAIL: expected evil-merges-found to be 'true' or 'false', got '$FOUND'"
            exit 1
          fi
          echo "PASS"

      - name: Assert evil-merge-count output is a number
        env:
          COUNT: ${{ steps.action.outputs.evil-merge-count }}
        run: |
          echo "evil-merge-count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected evil-merge-count to be a non-negative integer, got '$COUNT'"
            exit 1
          fi
          echo "PASS"
