name: Test since date filter
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          fail-on: critical
          severity: info
          since: "2024-01-01"
          version: latest

      - name: Assert outputs are set
        env:
          FOUND: ${{ steps.action.outputs.evil-merges-found }}
          COUNT: ${{ steps.action.outputs.evil-merge-count }}
        run: |
          echo "evil-merges-found: $FOUND"
          echo "evil-merge-count: $COUNT"
          if [ -z "$FOUND" ]; then
            echo "FAIL: evil-merges-found output is empty"
            exit 1
          fi
          if [ -z "$COUNT" ]; then
            echo "FAIL: evil-merge-count output is empty"
            exit 1
          fi
          echo "PASS: outputs are set"
