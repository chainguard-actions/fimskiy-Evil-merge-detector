name: Test pull request event context
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          fail-on: critical
          severity: warning
          version: latest

      - name: Assert evil-merges-found output is set
        env:
          FOUND: ${{ steps.action.outputs.evil-merges-found }}
        run: |
          echo "evil-merges-found: $FOUND"
          if [ -z "$FOUND" ]; then
            echo "FAIL: evil-merges-found output is empty"
            exit 1
          fi
          echo "PASS: evil-merges-found is '$FOUND'"

      - name: Assert evil-merge-count output is set
        env:
          COUNT: ${{ steps.action.outputs.evil-merge-count }}
        run: |
          echo "evil-merge-count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: evil-merge-count output is empty"
            exit 1
          fi
          echo "PASS: evil-merge-count is '$COUNT'"
